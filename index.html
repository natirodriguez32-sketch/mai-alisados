<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Monotributo – Córdoba</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#18202e;--mu:#667086;--bd:#e0e5ee;--pr:#1f4fd1;--prt:#fff;--ok:#1b7f47;--okb:#e1f3e8;--wa:#8a5a00;--wab:#fff1cf;--or:#b9400b;--orb:#ffe3d2;--bad:#ae2417;--badb:#fde2df;--inf:#1b4a8a;--infb:#dfeafa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#182030;--tx:#e8ecf4;--mu:#97a1b6;--bd:#2a3448;--pr:#7ba2ff;--prt:#0b1220;--ok:#66d393;--okb:#173222;--wa:#f2c35c;--wab:#3a2f12;--or:#ff9d66;--orb:#3b2314;--bad:#ff8a7e;--badb:#3d1c19;--inf:#8bb9f7;--infb:#162c47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182030;--tx:#e8ecf4;--mu:#97a1b6;--bd:#2a3448;--pr:#7ba2ff;--prt:#0b1220;--ok:#66d393;--okb:#173222;--wa:#f2c35c;--wab:#3a2f12;--or:#ff9d66;--orb:#3b2314;--bad:#ff8a7e;--badb:#3d1c19;--inf:#8bb9f7;--infb:#162c47;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px 14px 48px}
h1{font-size:21px;margin:6px 0 0}h2{font-size:17px;margin:22px 0 10px}
.mu{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
nav button,.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on,.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:24px;margin-top:2px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:11px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0 7px}
.bar i{display:block;height:100%;border-radius:9px}
.bar i.ok{background:var(--ok)}.bar i.wa{background:#e0a100}.bar i.or{background:var(--or)}.bar i.bad{background:var(--bad)}.bar i.inf{background:var(--pr)}
.b{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b.ok{background:var(--okb);color:var(--ok)}.b.wa{background:var(--wab);color:var(--wa)}.b.or{background:var(--orb);color:var(--or)}.b.bad{background:var(--badb);color:var(--bad)}.b.inf{background:var(--infb);color:var(--inf)}
.btn{border:0;background:var(--pr);color:var(--prt);padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.sm{padding:6px 11px;font-size:13px}.btn.del{background:var(--badb);color:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:12.5px;color:var(--mu);font-weight:600}tr:last-child td{border-bottom:0}
tbody tr.cl{cursor:pointer}tbody tr.cl:hover{background:var(--bg)}
.al{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.al:last-child{border-bottom:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{position:relative;min-width:46px;text-align:center}
.chip small{display:block;font-size:11px;font-weight:400;opacity:.8}
.ov{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mu);margin-top:11px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto;margin:0}
td input{margin:0;min-width:110px}
.md.wide{max-width:600px}.pv{max-height:300px;overflow:auto;border:1px solid var(--bd);border-radius:10px;margin:10px 0;background:#fff}.pv canvas{width:100%;display:block}summary{cursor:pointer}
.empty{text-align:center;padding:34px 16px}
.empty .btn{margin:4px}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;display:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head><body>
<div class="wrap">
<h1>Control de Monotributo</h1>
<div class="mu">Córdoba · Escalas de agosto 2026 a enero 2027 · Hoy: <span id="hoy"></span> · <span id="sync"></span></div>
<nav id="nav"></nav>
<main id="app"></main>
<p class="mu" style="margin-top:28px">Tus datos se guardan en este dispositivo y, si abrís la app desde tu cuenta de Claude, también en tu nube privada para verlos desde cualquier lugar. Hacé una copia de seguridad desde Ajustes.</p>
</div>
<input type="file" id="fi" accept="application/pdf,.pdf" multiple hidden onchange="onFiles(this.files)">
<div id="msg"></div><div id="modal"></div>
<script>
const KEY='monotributo_cba_v1',CATS='ABCDEFGHIJK'.split('');
const DEF={A:[12009410.45,49527.18,49527.18],B:[17595182.74,56379.08,56379.08],C:[24670494,66020,64539],D:[30628651,84614,82564],E:[36028231,119811,108267],F:[45151659,150784,129930],G:[53995798,230612,158815],H:[81924660,522706,317895],I:[91699761,null,474994],J:[105012519,null,580793],K:[126610830,null,702103]};
const IIBB={A:12560,B:21900,C:29290,D:43820,E:59340,F:75350,G:91150,H:143170,I:171960,J:202500,K:230270};
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const NOW=new Date(),TODAY=iso(NOW),THISM=TODAY.slice(0,7),CUT=iso(new Date(NOW.getFullYear()-1,NOW.getMonth(),NOW.getDate()));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=n=>(n===''||n==null||isNaN(n))?'—':new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const D=s=>s?s.split('-').reverse().join('/'):'—';
const MP=p=>p?['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+p.slice(5,7)-1]+' '+p.slice(0,4):'—';
const addM=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1+n,d))};
let S=load(),V='home',CAT=null;
function load(){let s={};try{s=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
 return{iibb:s.iibb||{...IIBB},docs:s.docs||[],scale:s.scale||JSON.parse(JSON.stringify(DEF)),clients:s.clients||[],invoices:s.invoices||[],pagos:s.pagos||[],rentas:s.rentas||[],planes:s.planes||[],seq:s.seq||1}}
const PARTS=['clients','invoices','pagos','rentas','planes'];let DB=null,PT,LAST={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(DB){clearTimeout(PT);PT=setTimeout(()=>push(),700)}}
const uid=()=>S.seq++;
function msg(t){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',2600)}
/* ---------- cálculos ---------- */
const cl=id=>S.clients.find(c=>c.id==id),cname=id=>cl(id)?cl(id).name:'(cliente borrado)';
const fact=id=>S.invoices.filter(i=>i.cid==id&&i.date>CUT&&i.date<=TODAY).reduce((a,i)=>a+(+i.amount||0),0);
const tope=c=>(S.scale[c.cat]||[0])[0]||0;
const quota=c=>{const s=c&&S.scale[c.cat];return s?(c.act==='Bienes'?s[2]:s[1]):null};
function st(c){const t=tope(c),f=fact(c.id),p=t?f/t:0;return{f,t,p,left:t-f,k:p>1?['bad','Se pasó del tope']:p>=.9?['or','Crítico']:p>=.8?['wa','Atención']:['ok','Dentro del tope']}}
const parts=p=>{const c=cl(p.cid);if(!c)return[0,0,0];const ex=/^(Exento|Convenio)/.test(c.reg||'');return[quota(c)||0,ex?0:(S.iibb[c.cat]||0),+c.muni||0]};
const pamt=p=>(p.amount!==''&&p.amount!=null)?+p.amount:parts(p).reduce((a,x)=>a+x,0);
const pstat=(due,paid,plan)=>paid?['ok','Pagado']:plan?['inf','En plan']:(due&&due<TODAY)?['bad','Vencido']:['wa','Pendiente'];
const pdue=p=>p.period+'-20';
function plst(p){if(+p.pagas>=+p.cuotas)return{k:['ok','Cancelado'],next:null,saldo:0};
 const next=p.first?addM(p.first,+p.pagas||0):null;
 return{k:next&&next<TODAY?['bad','Cuota vencida']:['ok','Al día'],next,saldo:Math.max(0,(p.cuotas-(p.pagas||0))*p.cuotaAmt)}}
const b=k=>`<span class="b ${k[0]}">${k[1]}</span>`;
/* ---------- vistas ---------- */
const TABS=[['home','Inicio'],['cats','Categorías'],['clients','Clientes'],['pagos','Pagos mensuales'],['planes','Planes de pago'],['folder','Carpeta de facturas'],['docs','Informes guardados'],['cfg','Ajustes']];
const go=v=>{V=v;render();scrollTo(0,0)};
function render(){document.getElementById('hoy').textContent=D(TODAY);
 document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${V==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 document.getElementById('app').innerHTML=VIEWS[V]()}
function empty(){return`<div class="card empty"><h2 style="margin-top:0">Empecemos cargando tu primer cliente</h2><p class="mu">1. Cargá tus clientes con su categoría.<br>2. Anotá cada factura que emitan.<br>3. La app te avisa cuánto les queda hasta el tope y qué pagos están vencidos.</p><button class="btn" onclick="edit('clients')">Agregar cliente</button><button class="btn sec" onclick="demo()">Ver con datos de ejemplo</button></div>`}
function kpi(l,v,sub=''){return`<div class="card kpi"><span class="mu">${l}</span><b>${v}</b><span class="mu">${sub}</span></div>`}
function ccard(c){const s=st(c);return`<div class="card"><div class="row"><b>${esc(c.name)}</b>${b(s.k)}</div><div class="mu">Categoría ${c.cat} · ${c.act}</div><div class="bar"><i class="${s.k[0]}" style="width:${Math.min(100,s.p*100)}%"></i></div><div class="row mu"><span>Usó el <b>${Math.round(s.p*100)}%</b> (${M(s.f)})</span><span>${s.left>=0?'Le quedan '+M(s.left):'Se pasó por '+M(-s.left)}</span></div><div class="tools" style="margin:10px 0 0"><button class="btn sm" onclick="up(${c.id})">Subir factura PDF</button><button class="btn sec sm" onclick="edit('invoices',0,{cid:${c.id}})">+ Manual</button><button class="btn sec sm" onclick="exp([${c.id}],'pdf')">Informe PDF</button><button class="btn sec sm" onclick="exp([${c.id}],'docx')">Informe Word</button></div></div>`}
function home(){if(!S.clients.length)return empty();
 const rows=S.clients.map(c=>({c,s:st(c)})).sort((a,b)=>b.s.p-a.s.p);
 const pv=S.pagos.filter(p=>pstat(pdue(p),p.paid,p.plan)[1]=='Vencido'),rv=S.rentas.filter(p=>pstat(p.due,p.paid,p.plan)[1]=='Vencido');
 const debt=pv.reduce((a,p)=>a+pamt(p),0)+rv.reduce((a,p)=>a+(+p.amount||0),0);
 const sal=S.planes.reduce((a,p)=>a+plst(p).saldo,0),risk=rows.filter(r=>r.s.p>=.8).length;
 const al=[];rows.filter(r=>r.s.p>=.8).forEach(r=>al.push([`${esc(r.c.name)} usó el ${Math.round(r.s.p*100)}% de su tope (cat. ${r.c.cat})`,b(r.s.k),'cats',r.c.cat]));
 pv.forEach(p=>al.push([`${esc(cname(p.cid))}: Monotributo de ${MP(p.period)} vencido (${M(pamt(p))})`,b(['bad','Vencido']),'pagos']));
 rv.forEach(p=>al.push([`${esc(cname(p.cid))}: Rentas ${MP(p.period)} vencido (${M(p.amount)})`,b(['bad','Vencido']),'rentas']));
 S.planes.filter(p=>plst(p).k[1]=='Cuota vencida').forEach(p=>al.push([`${esc(cname(p.cid))}: cuota vencida del plan ${esc(p.org)} (${D(plst(p).next)})`,b(['bad','Vencida']),'planes']));
 return`<div class="grid" style="margin-top:8px">${kpi('Clientes',S.clients.length)}${kpi('Cerca o sobre el tope',risk,'80% o más')}${kpi('Deuda vencida',M(debt),'Monotributo + Rentas')}${kpi('Saldo en planes',M(sal),'cuotas por pagar')}</div>
 <h2>Para atender ahora</h2><div class="card" style="padding:0">${al.length?al.map(a=>`<div class="al" onclick="${a[3]?`CAT='${a[3]}';`:''}go('${a[2]}')"><span>${a[0]}</span>${a[1]}</div>`).join(''):'<div class="empty">Todo al día. No hay nada urgente.</div>'}</div>
 <div class="row"><h2>Clientes y su tope (últimos 12 meses)</h2><span class="tools"><button class="btn sec sm" onclick="exp(S.clients.map(c=>c.id),'pdf')">Informe general PDF</button><button class="btn sec sm" onclick="exp(S.clients.map(c=>c.id),'docx')">Informe general Word</button></span></div><div class="cards">${rows.map(r=>ccard(r.c)).join('')}</div>`}
function cats(){const used=CATS.filter(c=>S.clients.some(x=>x.cat==c));if(!CAT)CAT=used[0]||'A';
 const list=S.clients.filter(c=>c.cat==CAT),sc=S.scale[CAT];
 const chips=CATS.map(c=>{const n=S.clients.filter(x=>x.cat==c).length;return`<button class="chip ${c==CAT?'on':''}" onclick="CAT='${c}';render()">${c}<small>${n} cliente${n==1?'':'s'}</small></button>`}).join('');
 const ids=list.map(c=>c.id),inv=S.invoices.filter(i=>ids.includes(+i.cid)).sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="chips">${chips}</div><div class="card"><div class="row"><b style="font-size:17px">Categoría ${CAT}</b><span class="mu">Tope anual: <b>${M(sc[0])}</b> · Rentas (IIBB) fijo: <b>${M(S.iibb[CAT])}</b> · Cuota: ${sc[1]===null?'':'servicios '+M(sc[1])+' · '}bienes ${M(sc[2])}</span></div>${sc[1]===null?'<div class="mu" style="margin-top:6px">Esta categoría es solo para venta de cosas muebles.</div>':''}</div>
 <h2>Clientes de esta categoría</h2>${list.length?`<div class="cards">${list.map(ccard).join('')}</div>`:`<div class="card empty"><p class="mu">Todavía no hay clientes en la categoría ${CAT}.</p><button class="btn" onclick="edit('clients',0,{cat:'${CAT}'})">Agregar cliente</button></div>`}
 ${list.length?`<h2>Facturas cargadas</h2>${T2(['Fecha','Cliente','Comprobante','Importe',''],inv.map(i=>[D(i.date),esc(cname(i.cid)),esc(i.num)||'—',M(i.amount),(i.file?`<button class="btn sec sm" onclick="event.stopPropagation();viewF(${i.file})">Ver PDF</button> `:'')+(i.date>CUT?'':'<span class="mu">fuera de los 12 meses</span>'),i.id]),'invoices','No hay facturas cargadas todavía.')}`:''}`}
function tbl(h,rows,ent,emptyT){if(!rows.length)return`<div class="card empty mu">${emptyT}</div>`;
 return`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="cl" onclick="edit('${ent}',${r[1]})">${r[0].map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
/* tbl recibe [celdas, id]; ajuste de forma */
const T2=(h,rows,ent,e)=>tbl(h,rows.map(r=>[r.slice(0,-1),r[r.length-1]]),ent,e);
function clients(){return`<div class="tools"><button class="btn" onclick="edit('clients')">+ Nuevo cliente</button></div>`+T2(['Cliente','CUIT','Categoría','Actividad','Rentas Córdoba'],S.clients.map(c=>[`<b>${esc(c.name)}</b>`,esc(c.cuit)||'—',c.cat,c.act,esc(c.iibb||'—')+' · '+esc(c.reg),c.id]),'clients','Todavía no cargaste clientes.')}
function pagos(){const rows=[...S.pagos].sort((a,b)=>b.period.localeCompare(a.period)).map(p=>{const k=pstat(pdue(p),p.paid,p.plan);
 return[esc(cname(p.cid)),MP(p.period),...parts(p).map(M),'<b>'+M(pamt(p))+'</b>',D(pdue(p)),D(p.paid),b(k),k[1]=='Pagado'||k[1]=='En plan'?'':`<button class="btn sm" onclick="event.stopPropagation();pay('pagos',${p.id})">Marcar pagado</button>`,p.id]});
 return`<p class="mu">En Córdoba el Monotributo es unificado: se paga en un solo acto el Monotributo nacional, Ingresos Brutos de Rentas (importe fijo por categoría) y la tasa municipal. Vence el día 20 de cada mes.</p><div class="tools"><button class="btn" onclick="edit('pagos')">+ Registrar pago</button><button class="btn sec" onclick="genMes()">Generar ${MP(THISM)} para todos</button></div>`+T2(['Cliente','Mes','Monotributo','Rentas (IIBB)','Tasa municipal','Total a pagar','Vence','Pagó el','Estado',''],rows,'pagos','No hay pagos registrados.')}
function rentas(){const rows=[...S.rentas].sort((a,b)=>b.period.localeCompare(a.period)).map(p=>{const k=pstat(p.due,p.paid,p.plan);
 return[esc(cname(p.cid)),MP(p.period),M(p.amount),D(p.due),D(p.paid),b(k),k[1]=='Pagado'||k[1]=='En plan'?'':`<button class="btn sm" onclick="event.stopPropagation();pay('rentas',${p.id})">Marcar pagado</button>`,p.id]});
 return`<p class="mu">Ingresos Brutos en la Dirección General de Rentas de Córdoba. Cargá el importe y el vencimiento que figuran en el portal de Rentas (CiDi) para cada cliente.</p><div class="tools"><button class="btn" onclick="edit('rentas')">+ Registrar Rentas</button></div>`+T2(['Cliente','Período','Importe','Vence','Pagó el','Estado',''],rows,'rentas','No hay pagos de Rentas registrados.')}
function planes(){const rows=S.planes.map(p=>{const x=plst(p),pc=Math.min(100,(+p.pagas||0)/(+p.cuotas||1)*100);
 return[`<b>${esc(cname(p.cid))}</b><div class="mu">${esc(p.org)} · ${esc(p.desc)}</div>`,`${p.pagas||0} de ${p.cuotas}<div class="bar" style="margin:5px 0 0;min-width:90px"><i class="inf" style="width:${pc}%"></i></div>`,M(p.cuotaAmt),M(x.saldo),D(x.next),b(x.k),+p.pagas>=+p.cuotas?'':`<button class="btn sm" onclick="event.stopPropagation();cuota(${p.id})">+ Cuota paga</button>`,p.id]});
 return`<p class="mu">Si un cliente se acoge a un plan de pagos (ARCA o Rentas), cargalo acá y andá sumando las cuotas que va pagando.</p><div class="tools"><button class="btn" onclick="edit('planes')">+ Nuevo plan</button></div>`+T2(['Cliente y deuda','Cuotas','Cada cuota','Saldo','Próximo venc.','Estado',''],rows,'planes','No hay planes de pago.')}
function cfg(){const inp=(c,i)=>S.scale[c][i]===null?'n/a':`<input type="number" step="any" value="${S.scale[c][i]}" onchange="sc('${c}',${i},this.value)">`;
 return`<h2 style="margin-top:8px">Escalas del Monotributo</h2><p class="mu">Se actualizan en febrero y agosto. Editá los valores cuando ARCA publique la nueva escala.</p><div class="tw"><table><thead><tr><th>Cat.</th><th>Tope anual</th><th>Cuota servicios</th><th>Cuota bienes</th><th>Rentas (IIBB) fijo</th></tr></thead><tbody>${CATS.map(c=>`<tr><td><b>${c}</b></td><td>${inp(c,0)}</td><td>${inp(c,1)}</td><td>${inp(c,2)}</td><td><input type="number" step="any" value="${S.iibb[c]}" onchange="ib('${c}',this.value)"></td></tr>`).join('')}</tbody></table></div>

function showRV(){const{f,o,pdf}=RV;let cid=UPCID;if(!cid){const h=S.clients.find(c=>dg(c.cuit)&&(o.cuits||[]).includes(dg(c.cuit)));cid=h?h.id:S.clients[0].id}
 const ok=o.date||o.num||o.amount!=null;
 document.getElementById('modal').innerHTML=`<div class="ov"><form class="md wide" oninput="rvChk()" onsubmit="rvSave(event);return false"><h2 style="margin:0">Nueva factura${Q.length?` <span class="mu">(faltan ${Q.length} más)</span>`:''}</h2><div class="mu">${esc(f.name)}</div><div class="pv" id="pvb">${pdf?'':'<p class="mu" style="padding:12px;color:#444">No se pudo mostrar la vista previa, pero el archivo se guarda igual.</p>'}</div><div class="mu" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'Datos leídos de la factura. Revisalos antes de guardar.':'No pude leer los datos automáticamente: completalos a mano.'}</div><div id="rvw" style="color:var(--bad);font-size:13px"></div>${fld(['cid','Cliente','client'],cid,1)}${fld(['date','Fecha de la factura','date'],o.date||TODAY,1)}${fld(['num','Tipo y número de comprobante','text'],o.num||'',0)}${fld(['amount','Importe total (nota de crédito en negativo)','num'],o.amount??'',1)}<div class="tools" style="margin-top:16px"><button class="btn">Guardar factura</button><button type="button" class="btn sec" onclick="next()">Omitir</button><button type="button" class="btn sec" onclick="Q=[];RV=null;closeM();render()">Cancelar</button></div></form></div>`;
 rvChk();if(pdf)drawPdf(pdf,document.getElementById('pvb'),1,1.4).catch(()=>{})}
function rvChk(){const s=document.querySelector('#modal select[name=cid]'),w=document.getElementById('rvw');if(!s||!w)return;const c=cl(s.value),cu=RV.o.cuits||[];
 w.textContent=cu.length&&c&&dg(c.cuit)&&!cu.includes(dg(c.cuit))?'Atención: el CUIT de esta factura no coincide con el de '+c.name+'.':''}
async function rvSave(ev){const fd=new FormData(ev.target),cid=+fd.get('cid'),num=(fd.get('num')||'').trim();
 if(num&&S.invoices.some(i=>i.cid==cid&&i.num==num)){msg('Esa factura ya está cargada para este cliente');return}
 const inv={id:uid(),cid,date:fd.get('date'),num,amount:+fd.get('amount')};
 try{const fid=uid();await fput({id:fid,name:RV.f.name,data:RV.buf});inv.file=fid;inv.fname=RV.f.name;try{const A=window.claude&&await claude.use('assets');if(A){const u=await A.upload(new Blob([RV.buf],{type:'application/pdf'}));inv.aid=u.id}}catch(e){}}catch(e){msg('No se pudo guardar el PDF, pero la factura se cargó')}
 S.invoices.push(inv);save();UPCID=UPCID||0;next()}
async function getF(fid){let r=null;try{r=await fget(fid)}catch(e){}if(r)return r;const i=S.invoices.find(x=>x.file==fid);if(!i||!i.aid)return null;const b=await(await fetch('/_blob/'+i.aid)).arrayBuffer();r={id:fid,name:i.fname||'factura.pdf',data:b};try{await fput(r)}catch(e){}return r}
async function viewF(fid){try{const r=await getF(fid);if(!r)return msg('No encuentro el archivo');
 document.getElementById('modal').innerHTML=`<div class="ov"><div class="md wide"><div class="row"><b>${esc(r.name)}</b><span class="tools" style="margin:0"><button class="btn sm" onclick="dlF(${fid})">Descargar</button><button class="btn sec sm" onclick="closeM()">Cerrar</button></span></div><div class="pv" id="pgs" style="max-height:72vh"></div></div></div>`;
 try{await drawPdf(await openPdf(r.data),document.getElementById('pgs'),5,1.4)}catch(e){document.getElementById('pgs').innerHTML='<p class="mu" style="padding:12px;color:#444">No se pudo mostrar la vista previa. Usá Descargar.</p>'}}catch(e){msg('No se pudo abrir el PDF')}}
async function dlF(fid){try{const r=await getF(fid);dl(r.name,new Blob([r.data],{type:'application/pdf'}))}catch(e){msg('No se pudo descargar')}}
function rmF(id,btn){if(!btn.dataset.s){btn.dataset.s=1;btn.textContent='¿Seguro?';return}const i=S.invoices.find(x=>x.file==id);fdel(id);if(i){delete i.file;delete i.fname;delete i.aid}save();render();msg('PDF quitado de la carpeta')}
function folder(){const cs=S.clients.filter(c=>S.invoices.some(i=>i.cid==c.id&&i.file));
 return`<p class="mu">Acá quedan guardadas las facturas originales (PDF) de cada cliente. Los datos se leen solos y se suman al control del tope.</p><div class="tools"><button class="btn" onclick="up(0)">+ Subir facturas PDF</button></div>`+(cs.length?cs.map(c=>{const l=S.invoices.filter(i=>i.cid==c.id&&i.file).sort((a,b)=>b.date.localeCompare(a.date));
 return`<details class="card" style="margin-bottom:10px" open><summary><b>📁 ${esc(c.name)}</b> <span class="mu">· ${l.length} archivo${l.length==1?'':'s'}</span></summary><div class="tw" style="margin-top:10px"><table><thead><tr><th>Fecha</th><th>Comprobante</th><th>Importe</th><th>Archivo</th><th></th></tr></thead><tbody>${l.map(i=>`<tr><td>${D(i.date)}</td><td>${esc(i.num||'—')}</td><td>${M(i.amount)}</td><td class="mu">${esc(i.fname||'')}</td><td style="white-space:nowrap"><button class="btn sm" onclick="viewF(${i.file})">Ver</button> <button class="btn sec sm" onclick="dlF(${i.file})">Descargar</button> <button class="btn del sm" onclick="rmF(${i.file},this)">Quitar PDF</button></td></tr>`).join('')}</tbody></table></div></details>`}).join(''):'<div class="card empty mu">Todavía no subiste facturas en PDF. Tocá “Subir facturas PDF” o usá el botón dentro de cada cliente.</div>')}
VIEWS.folder=folder;
/* ---------- nube: sincronización entre dispositivos ---------- */
let CAND=null,CM={};
const syncMsg=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
async function push(force){try{for(const k of PARTS){const j=JSON.stringify(S[k]);if(force||LAST[k]!==j){await DB.doc(k).set({v:S[k]});LAST[k]=j}}
 const j=JSON.stringify([S.scale,S.iibb,S.seq]);if(force||LAST.m!==j){await DB.doc('m').set({scale:S.scale,iibb:S.iibb,seq:S.seq});LAST.m=j}
 if(force)for(const d of S.docs)await DB.doc('inf_'+d.id).set(d);
 syncMsg('☁ Sincronizado '+new Date().toLocaleTimeString('es-AR',{timeStyle:'short'}))}catch(e){syncMsg('Sin conexión con la nube: se guardó en este dispositivo')}}
function applyCloud(m){S.scale=m.m.scale||S.scale;S.iibb=m.m.iibb||S.iibb;S.seq=Math.max(m.m.seq||1,S.seq);PARTS.forEach(k=>{S[k]=(m[k]&&m[k].v)||[];LAST[k]=JSON.stringify(S[k])});
 LAST.m=JSON.stringify([S.scale,S.iibb,S.seq]);S.docs=Object.keys(m).filter(k=>k.startsWith('inf_')).map(k=>m[k]).sort((a,b)=>b.date.localeCompare(a.date));
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
const fin=()=>{DB=CAND;try{localStorage.setItem('mono_synced','1')}catch(e){}closeM()};
function pick(){document.getElementById('modal').innerHTML='<div class="ov"><div class="md"><h2 style="margin:0">Hay datos distintos en este dispositivo</h2><p>Ya tenés datos guardados en tu nube y también en este dispositivo. ¿Cuáles querés conservar?</p><div class="tools"><button class="btn" onclick="useCloud()">Usar los de la nube</button><button class="btn sec" onclick="useLocal()">Usar los de este dispositivo</button></div></div></div>'}
function useCloud(){applyCloud(CM);fin();syncMsg('☁ Datos de la nube cargados')}
async function useLocal(){fin();await push(true)}
(async()=>{if(!window.claude){syncMsg('Datos solo en este dispositivo');return}
 try{const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);const id=u&&await u.id();if(!d||!id){syncMsg('Datos solo en este dispositivo (abrí la app desde tu cuenta de Claude para sincronizar)');return}
  CAND=d.collection('data/users/'+id);const snap=await CAND.get();snap.docs.forEach(x=>CM[x.id]=x.data());
  const cloud=CM.m&&((CM.clients&&CM.clients.v||[]).length>0||(CM.invoices&&CM.invoices.v||[]).length>0);
  if(!cloud){fin();await push(true)}else if(S.clients.length&&!localStorage.getItem('mono_synced'))pick();else{applyCloud(CM);fin();syncMsg('☁ Sincronizado')}
 }catch(e){syncMsg('No se pudo conectar con la nube: se usan los datos de este dispositivo')}})();
render();
</script></body></html>
